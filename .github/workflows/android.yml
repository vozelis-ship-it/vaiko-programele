# Sukuria pasirašytą Android APK ir GitHub Release (tag v<versija>, failas app-release.apk).
# Versija: android/version.txt (pvz. 1.0.3 → versionCode 10003).
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Patikrinti Secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Trūksta GitHub Secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Žr. docs/ANDROID.md."
            exit 1
          fi

      - name: Versija
        id: ver
        run: |
          V=$(tr -d '[:space:]' < version.txt)
          echo "name=$V" >> "$GITHUB_OUTPUT"
          IFS=. read -r A B C <<< "$V"
          echo "Versija $V → versionCode $((A * 10000 + B * 100 + C))"

      - name: Atkurti raktą
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Sukurti pasirašytą APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Mokausi v${{ steps.ver.outputs.name }}
          files: ${{ runner.temp }}/app-release.apk
          body: |
            Android programėlė „Mokausi“. Diegimas planšetėje: atsisiųsk app-release.apk (žr. docs/ANDROID.md).
