<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Mokausi ir žaidžiu</title>
<style>
:root{
  --bg:#eef2ff; --card:#ffffff; --ink:#1e1b4b; --muted:#6b7280;
  --brand:#4f46e5; --brand2:#7c3aed; --ok:#16a34a; --bad:#dc2626; --warn:#f59e0b;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(160deg,#e0e7ff 0%,#fce7f3 100%);
  color:var(--ink); -webkit-user-select:none; user-select:none; overflow-x:hidden;
}
#app{max-width:1000px;margin:0 auto;padding:14px 16px 40px;min-height:100%}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:28px;margin:0;flex:1;min-width:150px}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:20px;box-shadow:0 2px 8px #4f46e522;white-space:nowrap}
.pill.yt{color:#b91c1c}
.gear{background:#fff;border-radius:50%;width:46px;height:46px;font-size:22px;box-shadow:0 2px 8px #4f46e522}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{
  background:var(--card);border-radius:var(--r);padding:22px 12px;text-align:center;
  box-shadow:0 6px 18px #4f46e526;font-size:24px;font-weight:800;min-height:150px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s;
}
.tile:active{transform:scale(.96)}
.tile .ico{font-size:58px;line-height:1}
.tile small{font-size:15px;font-weight:600;color:var(--muted)}
.tile.math{background:linear-gradient(160deg,#dbeafe,#fff)}
.tile.lt{background:linear-gradient(160deg,#dcfce7,#fff)}
.tile.en{background:linear-gradient(160deg,#fee2e2,#fff)}
.tile.ext{background:linear-gradient(160deg,#fef3c7,#fff)}
.tile.yt{background:linear-gradient(160deg,#fecaca,#fff)}
.tile.locked{filter:grayscale(.7);opacity:.7}
.bar{height:16px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 4px #0002}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a)}
.card{background:#fff;border-radius:var(--r);padding:20px;box-shadow:0 6px 18px #4f46e51f;margin-bottom:16px}
.btn{background:var(--brand);color:#fff;border-radius:16px;padding:14px 22px;font-weight:800;font-size:20px;box-shadow:0 4px 0 #3730a3}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3730a3}
.btn.green{background:var(--ok);box-shadow:0 4px 0 #166534}
.btn.gray{background:#e5e7eb;color:#111827;box-shadow:0 4px 0 #9ca3af}
.btn.red{background:var(--bad);box-shadow:0 4px 0 #991b1b}
.btn.small{font-size:16px;padding:10px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.center{text-align:center}
.muted{color:var(--muted);font-size:15px}
.hint{font-size:15px;color:var(--muted);margin-top:10px}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qhead .bar{flex:1}
.qcard{background:#fff;border-radius:28px;padding:22px 18px;box-shadow:0 8px 24px #4f46e526;text-align:center}
.qprompt{font-size:26px;font-weight:800;margin:4px 0 10px}
.qvis{font-size:54px;line-height:1.25;margin:6px 0 14px;min-height:60px;word-break:break-word}
.qvis.eq{font-size:68px;font-weight:900;letter-spacing:2px}
.qvis .emo{font-size:64px}
.qvis .word{font-size:46px;font-weight:900;letter-spacing:4px;display:block}
.qvis .circle{width:130px;height:130px;border-radius:50%;margin:0 auto;border:4px solid #1118}
.spk{background:#eef2ff;border-radius:50%;width:56px;height:56px;font-size:28px;margin-left:8px;vertical-align:middle}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
.opts.n3{grid-template-columns:repeat(3,1fr)}
.opts.n4{grid-template-columns:repeat(4,1fr)}
@media (max-width:640px){.opts.n4{grid-template-columns:repeat(2,1fr)}.opts.n3{grid-template-columns:repeat(3,1fr)}}
.opt{background:#fff;border:4px solid #c7d2fe;border-radius:20px;padding:18px 8px;font-size:34px;font-weight:900;min-height:86px;color:var(--ink)}
.opt:active{transform:scale(.97)}
.opt.ok{background:#dcfce7;border-color:var(--ok)}
.opt.bad{background:#fee2e2;border-color:var(--bad)}
.opt.dim{opacity:.45}
.fb{min-height:60px;margin-top:14px;font-size:24px;font-weight:800}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.starburst{font-size:90px;margin:6px 0}

/* youtube */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.vcard{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px #0002;text-align:left;padding:0;display:block;width:100%}
.vcard img,.vcard .ph{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e5e7eb}
.vcard .ph{display:flex;align-items:center;justify-content:center;font-size:44px}
.vcard b{display:block;padding:10px 12px;font-size:17px}
.player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden}
.player-wrap iframe,.player-wrap #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.timer{font-size:30px;font-weight:900;color:#b91c1c}

/* pin */
.dots{display:flex;gap:14px;justify-content:center;margin:16px 0}
.dots i{width:22px;height:22px;border-radius:50%;background:#c7d2fe}
.dots i.on{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:12px;justify-content:center}
.pad button{background:#fff;border-radius:50%;width:92px;height:92px;font-size:34px;font-weight:800;box-shadow:0 3px 10px #0002}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* parent */
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #e5e7eb}
input[type=text],input[type=number],input[type=url],input[type=password]{
  font:inherit;padding:10px 12px;border:2px solid #c7d2fe;border-radius:12px;width:100%;user-select:text;-webkit-user-select:text;background:#fff}
label{display:block;font-weight:700;margin:12px 0 4px}
h2{margin:0 0 10px;font-size:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:14px 22px;border-radius:14px;font-size:18px;font-weight:700;z-index:50;max-width:90vw;text-align:center}

/* linksmybės */
.confetti{position:fixed;top:-40px;z-index:60;pointer-events:none;font-size:26px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pill.fire{color:#ea580c}
.coin{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:50%;font-size:20px;font-weight:900;margin:4px;vertical-align:middle;border:5px solid #d4a017;background:#e5e7eb;color:#374151}
.coin.c2{border-color:#cbd5e1;background:#facc15;width:70px;height:70px}
.note{display:inline-flex;align-items:center;justify-content:center;width:110px;height:58px;border-radius:8px;font-size:22px;font-weight:900;margin:4px;vertical-align:middle;background:#a8a29e;color:#fff;border:3px solid #78716c}
.opt.emo{font-size:52px;padding:10px 8px}
.opt:disabled{opacity:.3}
.slots{font-size:46px;font-weight:900;letter-spacing:6px;display:block;margin-top:6px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;width:92px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.badge span{font-size:40px;line-height:1.2}
.badge.off span{filter:grayscale(1);opacity:.25}
.badge.on{color:var(--ink)}
.lvl{font-size:13px;font-weight:800;color:var(--brand);background:#eef2ff;border-radius:99px;padding:2px 10px}
.overlay{position:fixed;inset:0;background:#1e1b4bcc;z-index:55;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .card{max-width:520px;width:100%;text-align:center;animation:pop .4s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.big-heart{font-size:110px;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.12)}}

/* šuniukas */
.petbox{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.pet{position:absolute;left:0;top:0;width:140px;height:112px;touch-action:none;cursor:grab;pointer-events:auto;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 4px 6px #0003)}
.pet-act{width:100%;height:100%;transform-origin:50% 90%;transition:transform .25s}
.pet-face{width:100%;height:100%}
.pet-face.flip{transform:scaleX(-1)}
.pet svg{display:block;overflow:visible;width:140px;height:108px}
.pet .leg,.pet .head,.pet .tail{transform-box:fill-box}
.pet .leg{transform-origin:50% 0}
.pet .head{transform-origin:30% 80%;transition:transform .25s}
.pet .tail{transform-origin:100% 100%;animation:wag 1.2s infinite ease-in-out}
@keyframes wag{50%{transform:rotate(28deg)}}
.pet-act.run .leg-a{animation:leg .22s infinite alternate}
.pet-act.run .leg-b{animation:leg .22s infinite alternate-reverse}
@keyframes leg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}

.pet-act.run .tail,.pet-act.wag .tail,.pet-act.sit .tail{animation-duration:.25s}
.pet-act.run{animation:bob .22s infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.pet-act.jump{animation:jump .7s}
@keyframes jump{40%{transform:translateY(-75px) scaleY(1.05)}80%{transform:translateY(0) scaleY(.9)}}
.pet-act.spin{animation:spin .8s}
@keyframes spin{to{transform:rotate(360deg)}}
.pet-act.salto{animation:salto 1s}
@keyframes salto{35%{transform:translateY(-80px) rotate(-200deg)}70%{transform:translateY(-30px) rotate(-360deg)}100%{transform:rotate(-360deg)}}
.pet-act.roll{animation:roll 1.4s}
@keyframes roll{30%,70%{transform:translateY(-12px) rotate(180deg)}}
.pet-act.sit{transform:rotate(-14deg)}
.pet-act.dance{animation:dance .35s infinite alternate}
@keyframes dance{from{transform:rotate(-12deg)}to{transform:rotate(12deg) translateY(-14px)}}
.pet-act.shake{animation:shk .12s 6 alternate}
@keyframes shk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.pet-act.eat .head,.pet-act.talk .head{animation:nom .18s infinite alternate}
@keyframes nom{to{transform:translateY(5px) rotate(8deg)}}
.pet-act.listen .head{transform:rotate(-14deg)}
.pet-act.held{transform:rotate(14deg) translateY(-6px)}
.pet-act.sleep{transform:scaleY(.86)}
.pet .eyec,.pet .tongue{display:none}
.pet-act.sleep .eye{display:none}
.pet-act.sleep .eyec,.pet-act.talk .tongue,.pet-act.eat .tongue,.pet-act.run .tongue,.pet-act.wag .tongue{display:inline}
.bubble{position:absolute;bottom:114px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px 12px;font-weight:800;font-size:16px;white-space:nowrap;box-shadow:0 2px 8px #0003;z-index:2}
.fx{position:absolute;font-size:26px;pointer-events:none;animation:up 1.4s forwards;z-index:3}
@keyframes up{to{transform:translateY(-80px) scale(1.3);opacity:0}}
.ball{position:absolute;left:0;top:0;font-size:30px;pointer-events:none}
.petbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Mokausi ir žaidžiu — 1 klasės užduotys + „YouTube“ už užduotis
   Duomenys saugomi planšetėje (localStorage) ir, jei įvestas šeimos kodas, sinchronizuojami su Firebase Firestore (be paskyrų, pagal slaptą kodą).
   ========================================================= */

const VERSION = '1.6 (2026-11-14)';   // keisti po kiekvieno pakeitimo — rodoma programos apačioje
const app = document.getElementById('app');
const KEY = 'vp_v1';
const DEFAULTS = {
  stars: 0,
  balance: 0,                       // sekundės „YouTube“ laiko
  bonusTotal: 0,                    // tėvų dalis: visas kada nors pridėtas papildomas laikas (sek.)
  bonusApplied: 0,                  // vaiko dalis: kiek jo jau pridėta prie balance
  earned: { date: '', sec: 0 },     // šiandien užsidirbta sekundžių
  log: [],                          // {d, s, t, ok}
  videos: [],                       // {kind:'video'|'playlist', id, title}
  rounds: 0,                        // užbaigtų raundų skaičius
  levels: { math: 1, lt: 1, en: 1 },// sunkumo lygis 1–3
  streak: { last: '', n: 0 },       // kiek dienų iš eilės
  badges: {},                       // {id: data}
  cheer: { id: 0, text: '' },       // tėvų dalis: paskutinis pagyrimas
  cheerSeen: 0,                     // tik šiame įrenginyje: kurį pagyrimą jau parodėme
  settings: {
    name: '',                       // vaiko vardas (kreipinys)
    sound: true,                    // garsai ir konfeti
    autoRead: true,                 // klausimus perskaityti automatiškai
    petOn: true,                    // rodyti šuniuką pradžios ekrane
    petName: 'Bobis',
    pin: '1234',
    perRound: 5,                    // minutės už sėkmingą raundą
    minCorrect: 7,                  // kiek teisingų iš 10 reikia
    cap: 20,                        // maks. minučių per dieną
    edukaMin: 5,                    // minutės už patvirtintą EDUKA/Oxford užduotį
    fullYT: false,                  // leisti atidaryti visą „YouTube“ (atskirai, laikas nuskaičiuojamas grįžus)
    eduka: 'https://eduka.lt/student/my-groups',
    oxford: 'https://englishhub.oup.com/young-learner/myDashboard'
  }
};
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') {
      return Object.assign({}, JSON.parse(JSON.stringify(DEFAULTS)), s, {
        settings: Object.assign({}, DEFAULTS.settings, s.settings || {}),
        earned: Object.assign({}, DEFAULTS.earned, s.earned || {}),
        levels: Object.assign({}, DEFAULTS.levels, s.levels || {})
      });
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
let st = load();
if (st.settings.petName === 'Pūkis') st.settings.petName = 'Bobis';   // senas numatytasis vardas

/* ---------- sinchronizacija su Firebase (Firestore REST, be SDK) ---------- */
const FB = { apiKey: 'AIzaSyCtQc4Rz7ETpxka5gNSqPMR2WTmmHtcQy8', projectId: 'lukrecijos-programele' };
const FAM_KEY = 'vp_family';
let famCode = '';
try { famCode = localStorage.getItem(FAM_KEY) || ''; } catch (e) {}
const P_F = ['videos', 'settings', 'bonusTotal', 'cheer'];                                              // tėvų duomenys
const C_F = ['stars', 'balance', 'earned', 'log', 'bonusApplied', 'rounds', 'levels', 'streak', 'badges']; // vaiko duomenys
const pickF = (o, F) => { const r = {}; F.forEach(f => r[f] = o[f]); return r; };
const partP = o => JSON.stringify(pickF(o, P_F));
const partC = o => JSON.stringify(pickF(o, C_F));
const clone = (v, d) => JSON.parse(JSON.stringify(v === undefined ? d : v));
let lastP = partP(st), lastC = partC(st), syncTimer = null, syncBusy = false, syncMsg = '', joining = false;
// Tėvų papildomas laikas keliauja kaip skirtumas (bonusTotal − bonusApplied), todėl nedingsta,
// net jei vaiko duomenis kitame įrenginyje perrašo naujesni. Laiko žymos (cts) nekeičia.
function applyBonus() {
  const d = (st.bonusTotal || 0) - (st.bonusApplied || 0);
  if (d <= 0) return;
  st.balance += d; st.bonusApplied = st.bonusTotal; lastC = partC(st);
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
}
applyBonus();
function save() {
  if (st.log.length > 500) st.log = st.log.slice(-500);
  const p = partP(st), c = partC(st), now = Date.now();
  if (p !== lastP) { st.pts = now; lastP = p; }
  if (c !== lastC) { st.cts = now; lastC = c; }
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
  schedSync();
}
function schedSync() { if (!famCode) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 4000); }
function docUrl() { return `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/families/${encodeURIComponent(famCode)}?key=${FB.apiKey}`; }
function setFam(code) {
  famCode = code; try { code ? localStorage.setItem(FAM_KEY, code) : localStorage.removeItem(FAM_KEY); } catch (e) {}
}
function newFamCode() {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, b => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
}
async function sync() {
  if (!famCode || syncBusy || !navigator.onLine) return;
  syncBusy = true;
  try {
    const r = await fetch(docUrl());
    let remote = null;
    if (r.status === 200) { const j = await r.json(); remote = JSON.parse(j.fields.data.stringValue); }
    else if (r.status !== 404) throw new Error('HTTP ' + r.status);
    let pulled = false, push = false;
    const playing = view === 'ytplay';
    const takeP = () => { P_F.forEach(f => st[f] = clone(remote[f], DEFAULTS[f]));
      st.settings = Object.assign({}, DEFAULTS.settings, st.settings || {}); st.pts = remote.pts || 0; pulled = true; };
    const takeC = () => { C_F.forEach(f => st[f] = clone(remote[f], DEFAULTS[f]));
      st.earned = Object.assign({}, DEFAULTS.earned, st.earned || {}); st.levels = Object.assign({}, DEFAULTS.levels, st.levels || {});
      st.cts = remote.cts || 0; pulled = true; };
    if (remote && joining) {
      // Prisijungiant prie esamo kodo laimi tas įrenginys, kuriame yra tikri duomenys (ne laiko žyma).
      if ((remote.videos || []).length || !st.videos.length) { takeP(); st.cheerSeen = (st.cheer || {}).id || 0; }
      else { st.pts = Date.now(); lastP = partP(st); push = true; }
      const act = o => (o.log || []).length + (o.stars || 0);
      if (act(remote) >= act(st)) takeC(); else { st.cts = Date.now(); lastC = partC(st); push = true; }
    } else if (remote) {
      const rp = remote.pts || 0, rc = remote.cts || 0, lp = st.pts || 0, lc = st.cts || 0;
      if (rp > lp) takeP();
      else if (rp < lp) push = true;
      if (rc > lc && !playing) takeC();
      else if (rc < lc) push = true;
    } else push = true;
    if (pulled) applyBonus();
    if (pulled) {
      lastP = partP(st); lastC = partC(st);
      try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
      if (view === 'home' || view === 'yt') render(); else showCheer();
    }
    if (push) {
      const body = { fields: {
        data: { stringValue: JSON.stringify(Object.assign(pickF(st, P_F), pickF(st, C_F), { pts: st.pts || 0, cts: st.cts || 0 })) },
        ts: { integerValue: String(Date.now()) } } };
      const w = await fetch(docUrl() + '&updateMask.fieldPaths=data&updateMask.fieldPaths=ts', {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!w.ok) throw new Error('HTTP ' + w.status);
    }
    joining = false;
    syncMsg = '✅ Sinchronizuota ' + new Date().toLocaleTimeString('lt-LT', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { syncMsg = '⚠️ Nepavyko sinchronizuoti (' + (e.message || e) + ')'; }
  finally { syncBusy = false; const el = document.getElementById('syncMsg'); if (el) el.textContent = syncMsg; }
}

/* ---------- pagalbinės ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const today = () => new Date().toLocaleDateString('sv-SE');
const fmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
function earnedToday() {
  if (st.earned.date !== today()) st.earned = { date: today(), sec: 0 };
  return st.earned.sec;
}
function credit(sec) {                // taiko dienos ribą
  const left = Math.max(0, st.settings.cap * 60 - earnedToday());
  const add = Math.min(sec, left);
  st.balance += add; st.earned.sec += add; save();
  return add;
}
function toast(msg) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ---------- garsai ir konfeti (be failų, per Web Audio) ---------- */
let actx = null;
function tone(seq) {             // seq: [[dažnis Hz, trukmė s], ...]
  if (!st.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    let t = actx.currentTime;
    for (const [f, d] of seq) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.05); t += d * 0.85;
    }
  } catch (e) {}
}

function voices() { try { return speechSynthesis.getVoices() || []; } catch (e) { return []; } }
function hasVoice(lang) { return voices().some(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase())); }
function speak(text, lang, pitch) {
  try {
    if (!text || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = 0.85; if (pitch) u.pitch = pitch;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function stopSpeech() { try { speechSynthesis.cancel(); } catch (e) {} }

function choices(correct, wrongs) {
  const set = [correct];
  for (const w of wrongs) if (!set.includes(w)) set.push(w);
  const opts = shuffle(set.slice(0, 4));
  return { opts, ans: opts.indexOf(correct) };
}
function numWrongs(ans, lo, hi) {
  const c = [];
  for (const d of [1, -1, 2, -2, 3, -3, 4, -4]) { const v = ans + d; if (v >= lo && v <= hi) c.push(v); }
  return shuffle(c).slice(0, 3);
}

  return `<svg viewBox="0 0 120 120" width="200" height="200"><circle cx="60" cy="60" r="57" fill="#fff" stroke="#4f46e5" stroke-width="5"/>${num}` +
    `<line x1="60" y1="60" x2="60" y2="32" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round" transform="rotate(${ha} 60 60)"/>` +
    `<line x1="60" y1="60" x2="60" y2="18" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" transform="rotate(${ma} 60 60)"/>` +
    `<circle cx="60" cy="60" r="4" fill="#1e1b4b"/></svg>`;
}

function makeRound(subj) {
  const S = SUBJECTS[subj], seen = new Set(), qs = [];
  const lvl = Math.min(3, Math.max(1, (st.levels || {})[subj] || 1));
  for (const t of shuffle(S.bags[lvl - 1])) {
    let q = null;
    for (let k = 0; k < 8; k++) {
      q = S.gen[t](lvl);
      const key = q.type + '|' + q.prompt + '|' + q.vis + '|' + (q.say ? q.say.t : '');
      if (!seen.has(key)) { seen.add(key); break; }
    }
    q.subj = subj; qs.push(q);
  }
  return qs;
}

const dayShift = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
function curStreak() { const s = st.streak || {}; return (s.last === today() || s.last === dayShift(-1)) ? (s.n || 0) : 0; }
function bumpStreak() {
  const s = st.streak = Object.assign({ last: '', n: 0 }, st.streak);
  if (s.last === today()) return;
  s.n = s.last === dayShift(-1) ? (s.n || 0) + 1 : 1; s.last = today();
}

const PET_SVG = (() => {

  const curls = (cx, cy, rx, ry, n, tipShare = 0.07) => { let s = '';
    for (let i = 0; i < n; i++) { const a = rr() * 6.283, d = Math.sqrt(rr()) * 0.85;
      s += `<circle cx="${(cx + rx * d * Math.cos(a)).toFixed(1)}" cy="${(cy + ry * d * Math.sin(a)).toFixed(1)}" r="${(1.2 + rr() * 1.1).toFixed(1)}" fill="none" stroke="${rr() < tipShare ? TIP : CURL}" stroke-width="1"/>`; }
    return s; };
  const blob = (cx, cy, rx, ry, curl = 3.2, fill = C, tex = 1) => {
    const n = Math.max(8, Math.round(Math.PI * (rx + ry) / (curl * 1.25)));
    let s = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}"/>`;
    for (let i = 0; i < n; i++) { const a = i / n * 6.283 + rr() * 0.2, k = curl * (0.85 + rr() * 0.35);

    return s + curls(cx, cy, rx, ry, Math.round(rx * ry / 14 * tex));

    for (let y = 60; y <= 88; y += 3.5) s += `<circle cx="${x - 5 + rr()}" cy="${y}" r="3" fill="${fill}"/><circle cx="${x + 5 - rr()}" cy="${y + 1.5}" r="3" fill="${fill}"/>`;
    return s + blob(x + 1, 91, 7.5, 4.5, 2.6, fill, 0.6) + curls(x, 74, 4, 13, 6, 0.15) + '</g>'; };
  return `<svg viewBox="0 0 130 100" aria-hidden="true">

    ${blob(101, 22, 13, 13, 3.2)}${blob(98, 11, 12, 7, 3)}

    <circle cx="119" cy="34" r="1.6" fill="${TIP}"/><circle cx="122" cy="35.5" r="1.5" fill="${TIP}"/><circle cx="116" cy="35.5" r="1.4" fill="${TIP}"/><circle cx="124" cy="33" r="1.3" fill="${TIP}"/>
    <ellipse cx="126" cy="29" rx="3.6" ry="3" fill="#000"/><circle cx="125" cy="28" r="0.9" fill="#777"/>
    ${blob(102, 15, 5, 2.2, 2)}
    ${blob(90, 33, 6.5, 14, 2.8, '#16161a')}
    <g class="eye"><circle cx="106.5" cy="23.5" r="4.2" fill="#fff"/><circle cx="107.8" cy="23.8" r="2.6" fill="#000"/><circle cx="108.7" cy="22.8" r="0.9" fill="#fff"/></g>
    <path class="eyec" d="M102.5 24 q3.5 2.5 7 0" stroke="#e5e7eb" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse class="tongue" cx="117" cy="40" rx="3.2" ry="4.5" fill="#f472b6"/>
    <path d="M110 36 q4 2.5 9 0" stroke="#55555c" stroke-width="1.3" fill="none" stroke-linecap="round"/>

})();

function petDo(name, ms) { pet.act = name; pet.actUntil = performance.now() + ms; if (name !== 'sleep') pet.sleeping = false; }
function petBubble(text, ms = 1800) {
  const el = document.getElementById('pet'); if (!el) return;
  const old = el.querySelector('.bubble'); if (old) old.remove();
  const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text; el.appendChild(b);

function petFx(emo, n = 3) {
  const box = document.getElementById('petbox'), el = document.getElementById('pet'); if (!box || !el) return;
  const m = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(el.style.transform) || [0, 0, 0];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const f = document.createElement('div'); f.className = 'fx'; f.textContent = emo;
    f.style.left = (+m[1] + 20 + Math.random() * 60) + 'px'; f.style.top = (+m[2] + Math.random() * 30) + 'px';
    box.appendChild(f); setTimeout(() => f.remove(), 1500);
  }, i * 180);
}
function petSnd(kind) {                     // garsai sintezuojami, be failų
  if (!st.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const sweep = (f1, f2, d, at, type = 'square', vol = 0.12) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + at;
      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.05);
    };
    if (kind === 'bark') { sweep(700, 300, 0.11, 0); sweep(750, 320, 0.13, 0.2); }
    if (kind === 'chomp') for (let i = 0; i < 5; i++) sweep(220, 90, 0.07, i * 0.3, 'triangle', 0.3);
    if (kind === 'boing') sweep(200, 900, 0.3, 0, 'sine', 0.2);
    if (kind === 'yawn') sweep(500, 180, 0.9, 0, 'sine', 0.15);
  } catch (e) {}
}
const PET_PHRASES = ['Labas!', 'Žaiskim!', 'Aš tave myliu!', 'Išspręsk užduotį, o aš palauksiu!', 'Mesk kamuoliuką!', 'Smagu su tavim!', 'Au au!'];
function petSay(text) { petBubble(text, 2200); petDo('talk', 1600); speak(text, 'lt-LT', 1.9); }
const PET_TRICKS = [
  () => { petDo('jump', 700); petSnd('bark'); petBubble('Au au!'); },
  () => { petDo('spin', 800); petSnd('boing'); petFx('✨'); },
  () => { petDo('salto', 1000); petSnd('boing'); petFx('⭐'); petBubble('Salto!'); },

function petTap() {
  if (pet.sleeping) { pet.sleeping = false; petDo('jump', 700); petSnd('bark'); petBubble('Jau atsibudau! 😃'); return; }
  pet.taps++;
  if (pet.taps % 8 === 0) { petDo('dance', 2500); petFx('🎉', 5); petBubble('Valio!'); tone([[523, .15], [659, .15], [784, .15], [1047, .3]]); return; }
  let i; do i = Math.floor(Math.random() * PET_TRICKS.length); while (i === pet.last);
  pet.last = i; PET_TRICKS[i]();
}
async function petTalk() {                  // pakartoja vaiko žodžius juokingu balsu
  if (pet.rec) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { petSay('Šioje planšetėje negaliu klausytis'); return; }
  pet.rec = true; pet.sleeping = false;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { pet.rec = false; toast('Leisk naudoti mikrofoną, kad šuniukas galėtų pakartoti.'); return; }
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  const rec = new MediaRecorder(stream), chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    try {
      const buf = await actx.decodeAudioData(await new Blob(chunks, { type: rec.mimeType }).arrayBuffer());
      const src = actx.createBufferSource(); src.buffer = buf; src.playbackRate.value = 1.6;
      src.connect(actx.destination); src.start();
      petDo('talk', buf.duration / 1.6 * 1000 + 200);
      src.onended = () => { pet.rec = false; };
      setTimeout(() => { pet.rec = false; }, buf.duration * 1000 + 500);
    } catch (e) { pet.rec = false; petBubble('Nieko neišgirdau 🙉'); }
  };
  rec.start(); petDo('listen', 3300); petBubble('Kalbėk! Klausausi... 👂', 3000);
  setTimeout(() => { try { rec.stop(); } catch (e) { pet.rec = false; } }, 3000);
}
function petLoop(now) {
  requestAnimationFrame(petLoop);
  const box = document.getElementById('petbox'), el = document.getElementById('pet');
  if (!box || !el) return;
  const W = box.clientWidth - 140, Hh = box.clientHeight - 112 - PET_TOP;
  if (W <= 0 || Hh <= 0) return;
  const busy = now < pet.actUntil;
  if (pet.celebrate) { pet.celebrate = false; petDo('salto', 1000); petSnd('bark'); petFx('🎉', 5); petBubble('Šaunu! Valio!'); }
  pet.moving = false;
  if (!pet.drag && !pet.sleeping && !busy) {
    if (pet.ball && !pet.carry) { pet.tx = pet.ball.x; pet.ty = pet.ball.y; }
    const dx = (pet.tx - pet.x) * W, dy = (pet.ty - pet.y) * Hh, dist = Math.hypot(dx, dy), sp = pet.ball ? 7 : 4;
    if (dist > sp) {
      pet.x += dx / dist * sp / W; pet.y += dy / dist * sp / Hh; pet.moving = true;
      if (Math.abs(dx) > 1) pet.dir = dx > 0 ? 1 : -1;
    } else if (pet.ball && !pet.carry) { pet.carry = true; pet.tx = 0.45; pet.ty = 0.5; petBubble('Pagavau!'); }
    else if (pet.ball) { pet.ball = null; pet.carry = false; petDo('wag', 1500); petFx('💖', 4); petSnd('bark'); petBubble('Dar kartą!'); }
    else if (now > pet.nextWander) {
      pet.nextWander = now + 2000 + Math.random() * 4000;
      if (Math.random() < 0.25) petDo(pick(['sit', 'wag']), 1500); else { pet.tx = Math.random(); pet.ty = Math.random(); }
    }
  }
  if (pet.sleeping && now > pet.nextZ) { pet.nextZ = now + 1300; petFx('💤', 1); }
  el.style.transform = `translate(${(pet.x * W).toFixed(1)}px, ${(PET_TOP + pet.y * Hh).toFixed(1)}px)`;
  const cls = 'pet-act' + (pet.drag && pet.drag.moved ? ' held' : pet.sleeping ? ' sleep' : busy ? ' ' + pet.act : '') + (pet.moving ? ' run' : '');
  const a = document.getElementById('petAct'); if (a && a.className !== cls) a.className = cls;
  const f = document.getElementById('petFace'), fc = 'pet-face' + (pet.dir < 0 ? ' flip' : ''); if (f && f.className !== fc) f.className = fc;
  let b = document.getElementById('ball');
  if (pet.ball) {
    if (!b) { b = document.createElement('div'); b.id = 'ball'; b.className = 'ball'; b.textContent = '🎾'; box.appendChild(b); }

    b.style.transform = `translate(${bx.toFixed(1)}px, ${by.toFixed(1)}px)`;
  } else if (b) b.remove();
}

function startRound(subj) { S = { subj, qs: makeRound(subj), i: 0, correct: 0, locked: false }; go('quiz'); }
function vQuiz() {
  const q = S.qs[S.i], n = S.qs.length;
  const labels = q.optLabels || q.opts;
  const cls = q.build ? '' : q.opts.length === 4 ? 'n4' : q.opts.length === 3 ? 'n3' : '';
  const grid = q.build ? ` style="grid-template-columns:repeat(${q.opts.length},1fr)"` : '';
  return `
  <div class="qhead">
    <button class="btn gray small" data-act="quit">← Pradžia</button>
    <div class="bar"><i style="width:${Math.round(S.i / n * 100)}%"></i></div>
    <b>${S.i + 1} / ${n}</b>
  </div>
  <div class="qcard">
    <div class="qprompt">${esc(q.prompt)}${q.say ? `<button class="spk" data-act="say" aria-label="Perskaityti">🔊</button>` : ''}</div>
    <div class="qvis ${q.visClass || ''}">${q.vis}</div>
    <div class="opts ${cls}"${grid}>
      ${labels.map((o, i) => `<button class="opt${q.emoOpts ? ' emo' : ''}" data-act="ans" data-i="${i}">${esc(o)}</button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <div id="nextWrap"></div>
  </div>`;
}
function answer(i) {
  if (S.locked) return;
  const q = S.qs[S.i];
  if (q.build) { buildTap(i); return; }
  S.locked = true;
  const ok = i === q.ans;
  app.querySelectorAll('.opt').forEach((b, k) => { if (k === q.ans) b.classList.add('ok'); else if (k === i) b.classList.add('bad'); else b.classList.add('dim'); });
  settle(q, ok);
}
function buildTap(i) {                        // „Sudėk žodį“: raidės spaudžiamos iš eilės
  const q = S.qs[S.i], btn = app.querySelectorAll('.opt')[i], sl = document.getElementById('slots');
  if (!btn || btn.disabled) return;
  if (q.opts[i] === q.word[q.pos]) {
    q.pos++; btn.disabled = true; SND.tap();
    if (sl) sl.textContent = q.word.map((ch, k) => k < q.pos ? ch : '_').join(' ');
    if (q.pos === q.word.length) { S.locked = true; settle(q, true); }
  } else {
    S.locked = true; btn.classList.add('bad');
    if (sl) sl.textContent = q.word.join(' ');
    settle(q, false);
  }
}
function settle(q, ok) {
  st.log.push({ d: today(), s: q.subj, t: q.type, ok });
  if (ok) { S.correct++; st.stars++; }
  save();
  const fb = document.getElementById('fb');
  const en = SUBJECTS[q.subj].lang === 'en';
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.textContent = ok ? (en ? '⭐ Great!' : '⭐ Puiku!') : (en ? 'Try again next time! 💪' : q.build ? 'Nieko tokio! Štai kaip rašoma. 💪' : 'Nieko tokio! Teisingas atsakymas pažymėtas žaliai. 💪');
  if (ok) { SND.ok(); confetti(8); } else SND.bad();
  if (q.after) speak(q.after.t, q.after.l);
  else if (st.settings.autoRead) speak(ok ? (en ? 'Great!' : 'Puiku!') : (en ? 'Oops!' : 'Nieko tokio'), en ? 'en-GB' : 'lt-LT');
  const cur = S;
  if (ok) setTimeout(() => { if (view === 'quiz' && S === cur) nextQ(); }, 1300);
  else document.getElementById('nextWrap').innerHTML = `<button class="btn" style="margin-top:12px" data-act="next">Toliau →</button>`;
}
function nextQ() {
  S.i++; S.locked = false;
  if (S.i >= S.qs.length) finishRound(); else render();
}
function finishRound() {
  const ok = S.correct >= st.settings.minCorrect;
  st.rounds = (st.rounds || 0) + 1; bumpStreak();
  st.levels = Object.assign({}, DEFAULTS.levels, st.levels);
  const lv = st.levels[S.subj] || 1;
  S.lvlUp = 0; S.lvlDown = false;
  if (S.correct >= 9 && lv < 3) { st.levels[S.subj] = lv + 1; S.lvlUp = lv + 1; }
  else if (S.correct <= 4 && lv > 1) { st.levels[S.subj] = lv - 1; S.lvlDown = true; }
  S.newBadges = checkBadges();
  S.earnedSec = ok ? credit(st.settings.perRound * 60) : 0;
  S.passed = ok; save(); go('done');
  if (ok) pet.celebrate = true;             // grįžus į pradžią šuniukas pasidžiaugs
  if (ok || S.lvlUp || S.newBadges.length) { SND.win(); confetti(ok ? 45 : 25); }
  if (st.settings.autoRead) speak(`Teisingai ${S.correct} iš ${S.qs.length}.` + (S.lvlUp ? ' Naujas lygis!' : ''), 'lt-LT');
}
function vDone() {

  let msg;
  if (!S.passed) msg = `Reikia bent ${st.settings.minCorrect} teisingų, kad gautum „YouTube“ laiko. Pabandyk dar kartą! 💪`;
  else if (S.earnedSec <= 0) msg = 'Šiandien jau užsidirbai didžiausią leistiną „YouTube“ laiką. Puiku! 🎉';

function loadYT(cb) {
  if (window.YT && YT.Player) { cb(); return; }
  ytq.push(cb);
  if (ytLoading) return;
  ytLoading = true;
  window.onYouTubeIframeAPIReady = () => { const q = ytq; ytq = []; q.forEach(f => f()); };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => { ytLoading = false; const m = document.getElementById('ytMsg'); if (m) m.textContent = 'Nepavyko prisijungti prie „YouTube“. Patikrink internetą.'; };
  document.head.appendChild(s);
}
function playVideo(v) {
  ytCur = v; ytPl = null; view = 'ytplay'; render();
  loadYT(() => {
    if (view !== 'ytplay') return;
    const vars = { rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, autoplay: 1 };
    const cfg = { host: 'https://www.youtube-nocookie.com', width: '100%', height: '100%', playerVars: vars,
      events: {
        onReady: e => { try { e.target.playVideo(); } catch (x) {} },
        onError: () => { const m = document.getElementById('ytMsg'); if (m) m.textContent = 'Šio vaizdo įrašo čia parodyti negalima. Pasirink kitą.'; }
      } };
    if (v.kind === 'video') cfg.videoId = v.id; else { vars.listType = 'playlist'; vars.list = v.id; }
    try { player = new YT.Player('player', cfg); } catch (e) {}
  });
  startTick();
}
function stopTick() { if (tick) { clearInterval(tick); tick = null; } }
function killPlayer() { try { player && player.destroy && player.destroy(); } catch (e) {} player = null; }
function startTick() {
  stopTick();
  tick = setInterval(() => {
    if (!player || !player.getPlayerState) return;
    let s = -1; try { s = player.getPlayerState(); } catch (e) {}
    if (s === 1 && ytCur && ytCur.kind === 'playlist' && !ytPl) { try { const pl = player.getPlaylist(); if (pl && pl.length) ytPl = pl.slice(); } catch (e) {} }
    if (s === 1 && !videoAllowed()) { blockVideo(); return; }
    if (s === 1) {
      st.balance = Math.max(0, st.balance - 1); save();
      const el = document.getElementById('ytTime'); if (el) el.textContent = fmt(st.balance);
      if (st.balance <= 0) { stopTick(); killPlayer(); go('ytend'); }
    }
  }, 1000);
}
function leaveYT() { stopTick(); killPlayer(); }
// Leidžiami tik tėvų patvirtinti įrašai (ir įrašai iš patvirtinto grojaraščio).
function curVideoId() {
  let id = '';
  try { id = (player.getVideoData() || {}).video_id || ''; } catch (e) {}
  if (!id) { try { const p = parseYT(player.getVideoUrl()); if (p && p.kind === 'video') id = p.id; } catch (e) {} }
  return id;
}
function videoAllowed() {
  const id = curVideoId();
  if (!id) return true;
  if (st.videos.some(v => v.kind === 'video' && v.id === id)) return true;
  if (ytCur && ytCur.kind === 'playlist' && (!ytPl || ytPl.includes(id))) return true;
  return false;
}
function blockVideo() {
  try {
    if (ytCur.kind === 'video') player.cueVideoById(ytCur.id);
    else player.cuePlaylist({ listType: 'playlist', list: ytCur.id });
  } catch (e) { try { player.stopVideo(); } catch (x) {} }
  const m = document.getElementById('ytMsg'); if (m) m.textContent = 'Šio vaizdo įrašo tėvai nepatvirtino. Žiūrėk patvirtintą.';
}

function parseYT(url) {
  url = (url || '').trim();
  const ID = /^[\w-]{11}$/;
  if (ID.test(url)) return { kind: 'video', id: url };                     // vien įrašo ID
  const m = url.match(/(?:https?:\/\/)?(?:[\w-]+\.)*(?:youtube\.com|youtube-nocookie\.com|youtu\.be)\/\S*/i);
  if (m) url = m[0];                                                        // nuoroda tekste (pvz. iš „Bendrinti“)
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;                  // be https://
  try {
    const u = new URL(url), host = u.hostname.toLowerCase();
    if (host === 'youtu.be') { const id = u.pathname.slice(1).split('/')[0]; if (ID.test(id)) return { kind: 'video', id }; }
    if (host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')) {
      const v = u.searchParams.get('v'); if (v && ID.test(v)) return { kind: 'video', id: v };
      const p = u.pathname.split('/').filter(Boolean);
      if (['shorts', 'embed', 'live'].includes(p[0]) && ID.test(p[1] || '')) return { kind: 'video', id: p[1] };
      const l = u.searchParams.get('list'); if (l) return { kind: 'playlist', id: l };
    }
  } catch (e) {}
  return null;
}

  yt() { go('yt'); },
  fullyt() {
    if (!st.settings.fullYT || st.balance <= 0) return;
    st.ytAway = Date.now(); save();
    window.open('https://www.youtube.com/', '_blank', 'noopener');
  },
  play(d) { const v = st.videos[+d.i]; if (v && st.balance > 0) playVideo(v); },
  ytback() { leaveYT(); go('yt'); },
  pin(d) { pinKey(d.k); },
  bonus(d) { st.bonusTotal = (st.bonusTotal || 0) + (+d.m) * 60; applyBonus(); save(); render(); },
  resetbal() { st.balance = 0; save(); render(); },
  pfeed() { petDo('eat', 1800); petSnd('chomp'); petBubble('Skanu! 😋'); setTimeout(() => petFx('💖', 3), 1500); },
  pball() { if (pet.ball) return; pet.sleeping = false; pet.carry = false; pet.ball = { x: Math.random(), y: 0.15 + Math.random() * 0.6 }; petSnd('bark'); petBubble('Bėgu! 🏃'); },
  pdance() { petDo('dance', 3000); petFx('🎵', 5); tone([[523, .2], [659, .2], [784, .2], [659, .2], [523, .2], [784, .35], [1047, .45]]); },
  ptalk() { petTalk(); },
  psleep() { pet.sleeping = true; pet.ball = null; pet.carry = false; pet.tx = pet.x; pet.ty = pet.y; petSnd('yawn'); petBubble('Labanakt... 😴'); },
  cheer() {
    const text = document.getElementById('cheertext').value.trim() || 'Didžiuojuosi tavimi! ❤️';
    st.cheer = { id: Date.now(), text }; st.cheerSeen = st.cheer.id;   // šiame įrenginyje nerodyti
    save(); sync(); render();
    toast(famCode ? 'Išsiųsta! Vaiko planšetėje pasirodys per minutę.' : 'Įjunk sinchronizaciją, kad žinutė nueitų į kitą įrenginį.');
  },
  addvideo() {
    const url = document.getElementById('vurl').value, title = document.getElementById('vtitle').value.trim();
    const p = parseYT(url);
    if (!p) { toast(/youtube\.com\/(@|c\/|channel\/|user\/)/i.test(url) ? 'Kanalo pridėti negalima — įklijuok konkretaus vaizdo įrašo ar grojaraščio nuorodą.' : 'Nepavyko atpažinti „YouTube“ nuorodos.'); return; }
    if (st.videos.some(v => v.kind === p.kind && v.id === p.id)) { toast('Šis jau pridėtas.'); return; }
    st.videos.push({ kind: p.kind, id: p.id, title: title || (p.kind === 'video' ? 'Vaizdo įrašas' : 'Grojaraštis') });
    save(); render(); toast('Pridėta');
  },
  delvideo(d) { st.videos.splice(+d.i, 1); save(); render(); },
  newfam() {
    if (famCode && !confirm('Šiame įrenginyje jau yra kodas. Pakeisti nauju?')) return;
    setFam(newFamCode()); st.pts = Date.now(); st.cts = Date.now(); syncMsg = ''; save(); sync(); render(); toast('Naujas kodas sukurtas');
  },
  syncnow() { if (!famCode) { toast('Pirma įvesk arba sukurk šeimos kodą.'); return; } syncMsg = 'Sinchronizuojama…'; render(); sync(); }
};
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = H[t.dataset.act]; if (f) f(t.dataset);
});
// Šuniuką galima paspausti (triukas), patempti pirštu arba paspausti pievelėje (nubėga ten).
app.addEventListener('pointerdown', e => {
  const box = e.target.closest && e.target.closest('#petbox'); if (!box) return;
  const r = box.getBoundingClientRect();
  if (e.target.closest('#pet')) { pet.drag = { sx: e.clientX, sy: e.clientY, moved: false, r }; e.preventDefault(); return; }
  pet.sleeping = false;
  pet.tx = clamp01((e.clientX - r.left - 70) / (r.width - 140)); pet.ty = clamp01((e.clientY - r.top - 56 - PET_TOP) / (r.height - 112 - PET_TOP));
});
window.addEventListener('pointermove', e => {
  const d = pet.drag; if (!d) return;
  if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) > 8) { d.moved = true; pet.sleeping = false; pet.actUntil = 0; }
  if (d.moved) {
    pet.x = pet.tx = clamp01((e.clientX - d.r.left - 70) / (d.r.width - 140));
    pet.y = pet.ty = clamp01((e.clientY - d.r.top - 56 - PET_TOP) / (d.r.height - 112 - PET_TOP));
  }
});
const petUp = () => {
  const d = pet.drag; if (!d) return; pet.drag = null;
  if (d.moved) { petDo('jump', 700); petSnd('boing'); petBubble('Vėl ant žemės!'); } else petTap();
};
window.addEventListener('pointerup', petUp);
window.addEventListener('pointercancel', petUp);
app.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.fam) {
    const v = e.target.value.trim().toLowerCase();
    if (v === '') { setFam(''); syncMsg = ''; toast('Sinchronizacija išjungta'); render(); return; }
    if (!/^[a-z0-9]{12,64}$/.test(v)) { toast('Kodas: 12–64 raidės ar skaičiai.'); render(); return; }
    if (v === famCode) return;
    setFam(v); joining = true; syncMsg = 'Sinchronizuojama…'; render(); sync(); return;
  }
  if (e.target.dataset && e.target.dataset.lvl) {
    st.levels = Object.assign({}, DEFAULTS.levels, st.levels);
    st.levels[e.target.dataset.lvl] = Math.min(3, Math.max(1, parseInt(e.target.value, 10) || 1));
    save(); toast('Išsaugota'); render(); return;
  }
  const k = e.target.dataset && e.target.dataset.set; if (!k) return;
  let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (['perRound', 'minCorrect', 'cap', 'edukaMin'].includes(k)) {
    v = Math.max(0, parseInt(v, 10) || 0);
    if (k === 'minCorrect') v = Math.min(10, Math.max(1, v));
  }
  if (k === 'pin') { if (!/^\d{4}$/.test(v)) { toast('PIN turi būti 4 skaitmenys.'); render(); return; } }
  if (k === 'name') v = String(v).trim();
  st.settings[k] = v; save(); toast('Išsaugota'); if (k === 'pin') render();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeech(); });
// Grįžus iš viso „YouTube“ nuskaičiuojamas ten praleistas laikas.
function backFromFullYT() {
  if (!st.ytAway) return;
  const sec = Math.max(0, Math.round((Date.now() - st.ytAway) / 1000)), used = Math.min(sec, st.balance);
  st.balance -= used; st.ytAway = 0; save();
  if (view === 'home' || view === 'yt') render();
  toast(`„YouTube“ sunaudota ${Math.max(1, Math.round(used / 60))} min.` + (st.balance <= 0 ? ' Laikas baigėsi!' : ''));
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) backFromFullYT(); });

/* testavimo kabliukas (?selftest) */
window.__vp = { getRound: () => S, SUBJECTS, makeRound, parseYT, credit, getState: () => st, LT_WORDS, sync, setFam, newFamCode };
render();
backFromFullYT();
sync();
setInterval(() => { if (view !== 'ytplay') sync(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
window.addEventListener('online', sync);
</script>
